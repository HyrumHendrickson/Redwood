name: Bug report
description: Report incorrect behaviour or a crash (not a security vulnerability; see SECURITY.md)
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact command line or GUI settings, including the seed.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit hash
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Operating system and compiler
    validations:
      required: true
